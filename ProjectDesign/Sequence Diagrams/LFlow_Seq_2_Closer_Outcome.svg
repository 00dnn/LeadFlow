<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 670" width="1580" height="670" style="background:#FFFFFF; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="soft-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="16" width="1520" height="52" rx="8" fill="#1E293B" filter="url(#card-shadow)"/>
  <text x="50" y="48" fill="#FFFFFF" font-size="18" font-weight="700">LeadFlow — Sequence 2: Closer Consultation &amp; Outcome Recording</text>
  <text x="1230" y="47" fill="#94A3B8" font-size="12" font-weight="500">Scenario: Closer Workflow, Permissions &amp; State Transition</text>

  <!-- Layer Group Boxes -->
  <rect x="50" y="80" width="120" height="520" rx="8" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="1.5"/>
  <text x="60" y="100" fill="#C2410C" font-size="10" font-weight="700" letter-spacing="1">ACTOR (CLOSER)</text>

  <rect x="180" y="80" width="370" height="520" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="195" y="100" fill="#0369A1" font-size="10" font-weight="700" letter-spacing="1">PRESENTATION (MVC)</text>

  <rect x="560" y="80" width="310" height="520" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="575" y="100" fill="#15803D" font-size="10" font-weight="700" letter-spacing="1">SERVICE LAYER</text>

  <rect x="880" y="80" width="180" height="520" rx="8" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="895" y="100" fill="#7E22CE" font-size="10" font-weight="700" letter-spacing="1">DOMAIN MODEL</text>

  <rect x="1070" y="80" width="270" height="520" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="1085" y="100" fill="#B45309" font-size="10" font-weight="700" letter-spacing="1">PERSISTENCE</text>

  <rect x="1350" y="80" width="180" height="520" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1365" y="100" fill="#475569" font-size="10" font-weight="700" letter-spacing="1">OBSERVER BUS</text>

  <!-- Lifelines -->
  <line x1="110" y1="160" x2="110" y2="585" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="240" y1="160" x2="240" y2="585" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="360" y1="160" x2="360" y2="585" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="480" y1="160" x2="480" y2="585" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="620" y1="160" x2="620" y2="585" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="750" y1="160" x2="750" y2="585" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="970" y1="160" x2="970" y2="585" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="1135" y1="160" x2="1135" y2="585" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="1275" y1="160" x2="1275" y2="585" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="1440" y1="160" x2="1440" y2="585" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Participant Headers -->
  <rect x="60" y="115" width="100" height="42" rx="6" fill="#FEF3C7" stroke="#EA580C" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="110" y="133" fill="#9A3412" font-size="11" font-weight="700" text-anchor="middle">Closer</text>
  <text x="110" y="147" fill="#64748B" font-size="9" text-anchor="middle">(Alex Rivera)</text>

  <rect x="190" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="240" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">Web UI</text>
  <text x="240" y="147" fill="#64748B" font-size="9" text-anchor="middle">(index.html)</text>

  <rect x="310" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="360" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">ModalController</text>
  <text x="360" y="147" fill="#64748B" font-size="9" text-anchor="middle">Controller</text>

  <rect x="430" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="480" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">DashboardCtrl</text>
  <text x="480" y="147" fill="#64748B" font-size="9" text-anchor="middle">Controller</text>

  <rect x="570" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="620" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">UserService</text>
  <text x="620" y="147" fill="#15803D" font-size="9" text-anchor="middle">Active User</text>

  <rect x="700" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="750" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">LeadService</text>
  <text x="750" y="147" fill="#15803D" font-size="9" text-anchor="middle">Business Logic</text>

  <rect x="910" y="115" width="120" height="42" rx="6" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="970" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">Lead &amp; History</text>
  <text x="970" y="147" fill="#7E22CE" font-size="9" text-anchor="middle">Domain Entity</text>

  <rect x="1080" y="115" width="110" height="42" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1135" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">ILeadRepository</text>
  <text x="1135" y="147" fill="#B45309" font-size="9" text-anchor="middle">LocalStorageImpl</text>

  <rect x="1225" y="115" width="100" height="42" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1275" y="133" fill="#78350F" font-size="11" font-weight="700" text-anchor="middle">localStorage</text>
  <text x="1275" y="147" fill="#B45309" font-size="9" text-anchor="middle">Browser Storage</text>

  <rect x="1390" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1440" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">EventEmitter</text>
  <text x="1440" y="147" fill="#475569" font-size="9" text-anchor="middle">Observer Bus</text>

  <!-- Sequence Messages -->
  <!-- 2.1 -->
  <line x1="110" y1="185" x2="238" y2="185" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="120" y="179" fill="#9A3412" font-size="11">1. Closer selects assigned lead &amp; opens "View Details"</text>

  <!-- 2.2 -->
  <line x1="240" y1="210" x2="358" y2="210" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="204" fill="#0369A1" font-size="11">2. openLeadDetails(leadId)</text>

  <!-- 2.3 -->
  <line x1="360" y1="235" x2="748" y2="235" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="370" y="229" fill="#15803D" font-size="11">3. leadService.getLeadById(leadId) -&gt; repo.getById(leadId)</text>

  <line x1="750" y1="255" x2="362" y2="255" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="370" y="250" fill="#64748B" font-size="10">returns lead aggregate entity</text>

  <!-- 2.4 -->
  <line x1="360" y1="275" x2="242" y2="275" stroke="#0284C7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="250" y="269" fill="#0369A1" font-size="10">Renders Customer Meta, Audit Timeline &amp; editable Outcome Form</text>

  <!-- 2.5 Submit Outcome -->
  <line x1="110" y1="305" x2="238" y2="305" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="120" y="299" fill="#9A3412" font-size="11" font-weight="600">4. Selects newStatus="WON", inputs consultation notes &amp; clicks "Save Status Update"</text>

  <!-- 2.6 -->
  <line x1="240" y1="330" x2="358" y2="330" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="324" fill="#0369A1" font-size="11">5. _handleCloserUpdateSubmit(event, leadId)</text>

  <!-- 2.7 Fetch closer user -->
  <line x1="360" y1="350" x2="618" y2="350" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="370" y="344" fill="#0F172A" font-size="10">6. getActiveUser() -&gt; returns closerUser (Alex Rivera)</text>

  <!-- 2.8 Update Lead Outcome -->
  <line x1="360" y1="375" x2="748" y2="375" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="370" y="369" fill="#15803D" font-size="11" font-weight="700">7. updateLeadOutcome(leadId, "WON", note, closerUser)</text>

  <!-- Security Gate Self-Call -->
  <path d="M 750 390 L 790 390 L 790 410 L 752 410" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="403" fill="#DC2626" font-size="10" font-weight="600">Security Gate: Asserts closer.role === 'closer' &amp;&amp; lead.closerId === closer.id</text>

  <!-- 2.9 Lead updateStatus -->
  <line x1="750" y1="435" x2="968" y2="435" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="760" y="429" fill="#6B21A8" font-size="11">8. lead.updateStatus("WON", note, closerUser) -&gt; Appends immutable HistoryEntry</text>

  <!-- 2.10 Repo update -->
  <line x1="750" y1="465" x2="1133" y2="465" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="760" y="459" fill="#B45309" font-size="11">9. repository.update(lead)</text>

  <!-- 2.11 localStorage -->
  <line x1="1135" y1="485" x2="1273" y2="485" stroke="#D97706" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
  <text x="1145" y="479" fill="#B45309" font-size="10">setItem("leadflow_leads", serializedLeads)</text>

  <!-- 2.12 Emit event -->
  <line x1="750" y1="510" x2="1438" y2="510" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="504" fill="#1E293B" font-size="11">10. eventEmitter.emit("lead:updated", updatedLead)</text>

  <!-- 2.13 Observer KPI update -->
  <line x1="1440" y1="535" x2="482" y2="535" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="529" fill="#0369A1" font-size="11">11. Observer: on("lead:updated") -&gt; increments "Deals Won" KPI &amp; updates table badge</text>

  <!-- Return updated lead to ModalCtrl -->
  <line x1="750" y1="555" x2="362" y2="555" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="370" y="549" fill="#64748B" font-size="10">returns updated lead entity</text>

  <!-- 2.14 Refresh modal & feedback -->
  <line x1="360" y1="575" x2="242" y2="575" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="250" y="569" fill="#0369A1" font-size="10">refreshCurrentDetails(): displays new HistoryEntry in timeline &amp; Toast.success()</text>

  <!-- Return feedback to Closer -->
  <line x1="240" y1="595" x2="112" y2="595" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="120" y="589" fill="#64748B" font-size="10">Displays updated audit trail with "WON" status pill</text>

  <!-- Legend -->
  <rect x="50" y="615" width="1480" height="38" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="638" fill="#475569" font-size="11" font-weight="600">Key Principles:</text>
  <text x="180" y="638" fill="#DC2626" font-size="11">Role-Based Security Gate (LeadService verification)</text>
  <text x="560" y="638" fill="#7E22CE" font-size="11">Immutable Audit Trail (HistoryEntry created inside Lead)</text>
  <text x="960" y="638" fill="#B45309" font-size="11">Repository Pattern (Seamless State Persistence)</text>
</svg>
