<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480" style="background:#FFFFFF; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="soft-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="16" width="1340" height="52" rx="8" fill="#1E293B" filter="url(#card-shadow)"/>
  <text x="50" y="48" fill="#FFFFFF" font-size="18" font-weight="700">LeadFlow — Sequence 3: Closed Feedback Loop &amp; Audit Review</text>
  <text x="1060" y="47" fill="#94A3B8" font-size="12" font-weight="500">Scenario: Setter Deal Inspection &amp; Audit Trail</text>

  <!-- Layer Group Boxes -->
  <rect x="50" y="80" width="130" height="330" rx="8" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="65" y="100" fill="#1E40AF" font-size="10" font-weight="700" letter-spacing="1">ACTOR (SETTER)</text>

  <rect x="200" y="80" width="320" height="330" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="215" y="100" fill="#0369A1" font-size="10" font-weight="700" letter-spacing="1">PRESENTATION (MVC)</text>

  <rect x="540" y="80" width="200" height="330" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="555" y="100" fill="#15803D" font-size="10" font-weight="700" letter-spacing="1">SERVICE LAYER</text>

  <rect x="760" y="80" width="200" height="330" rx="8" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="775" y="100" fill="#7E22CE" font-size="10" font-weight="700" letter-spacing="1">DOMAIN MODEL</text>

  <rect x="980" y="80" width="370" height="330" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="995" y="100" fill="#B45309" font-size="10" font-weight="700" letter-spacing="1">PERSISTENCE LAYER</text>

  <!-- Lifelines -->
  <line x1="115" y1="160" x2="115" y2="395" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="270" y1="160" x2="270" y2="395" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="440" y1="160" x2="440" y2="395" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="640" y1="160" x2="640" y2="395" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="860" y1="160" x2="860" y2="395" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="1080" y1="160" x2="1080" y2="395" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="1250" y1="160" x2="1250" y2="395" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Participant Headers -->
  <rect x="65" y="115" width="100" height="42" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="115" y="133" fill="#1E40AF" font-size="11" font-weight="700" text-anchor="middle">Setter</text>
  <text x="115" y="147" fill="#64748B" font-size="9" text-anchor="middle">(Sarah Jenkins)</text>

  <rect x="220" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="270" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">Web UI</text>
  <text x="270" y="147" fill="#64748B" font-size="9" text-anchor="middle">(index.html)</text>

  <rect x="390" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="440" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">ModalController</text>
  <text x="440" y="147" fill="#64748B" font-size="9" text-anchor="middle">Controller</text>

  <rect x="590" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="640" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">LeadService</text>
  <text x="640" y="147" fill="#15803D" font-size="9" text-anchor="middle">Business Logic</text>

  <rect x="800" y="115" width="120" height="42" rx="6" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="860" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">Lead &amp; History</text>
  <text x="860" y="147" fill="#7E22CE" font-size="9" text-anchor="middle">Domain Entity</text>

  <rect x="1025" y="115" width="110" height="42" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1080" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">ILeadRepository</text>
  <text x="1080" y="147" fill="#B45309" font-size="9" text-anchor="middle">LocalStorageImpl</text>

  <rect x="1200" y="115" width="100" height="42" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1250" y="133" fill="#78350F" font-size="11" font-weight="700" text-anchor="middle">localStorage</text>
  <text x="1250" y="147" fill="#B45309" font-size="9" text-anchor="middle">Browser Storage</text>

  <!-- Sequence Messages -->
  <!-- 3.1 -->
  <line x1="115" y1="185" x2="268" y2="185" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="125" y="179" fill="#1E40AF" font-size="11">1. Setter switches to Sarah Jenkins, clicks "View Details" on lead</text>

  <!-- 3.2 -->
  <line x1="270" y1="210" x2="438" y2="210" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="204" fill="#0369A1" font-size="11">2. openLeadDetails(leadId)</text>

  <!-- 3.3 -->
  <line x1="440" y1="235" x2="638" y2="235" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="450" y="229" fill="#15803D" font-size="11">3. leadService.getLeadById(leadId)</text>

  <!-- 3.4 -->
  <line x1="640" y1="260" x2="1078" y2="260" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="650" y="254" fill="#B45309" font-size="11">4. repository.getById(leadId)</text>

  <!-- 3.5 -->
  <line x1="1080" y1="285" x2="1248" y2="285" stroke="#D97706" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
  <text x="1090" y="279" fill="#B45309" font-size="10">getItem("leadflow_leads")</text>

  <!-- 3.6 Reconstitute -->
  <line x1="1080" y1="310" x2="862" y2="310" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="875" y="304" fill="#6B21A8" font-size="11">5. Reconstitute Lead with full HistoryEntry[] list</text>

  <!-- Repo returns to Service -->
  <line x1="1080" y1="330" x2="642" y2="330" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="650" y="324" fill="#64748B" font-size="10">returns lead domain entity</text>

  <!-- Service returns to ModalCtrl -->
  <line x1="640" y1="352" x2="442" y2="352" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="450" y="346" fill="#64748B" font-size="10">returns lead</text>

  <!-- 3.7 -->
  <line x1="440" y1="374" x2="272" y2="374" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="280" y="368" fill="#0369A1" font-size="10">Renders Read-Only View: Closer's outcome notes &amp; transition (PENDING -&gt; WON)</text>

  <!-- 3.8 -->
  <line x1="270" y1="396" x2="117" y2="396" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="125" y="390" fill="#64748B" font-size="10">Feedback loop closed: Setter verifies completed sale and notes</text>

  <!-- Legend -->
  <rect x="50" y="425" width="1300" height="38" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="448" fill="#475569" font-size="11" font-weight="600">Key Principles:</text>
  <text x="180" y="448" fill="#7E22CE" font-size="11">Immutable Audit Trail (Historical Verification)</text>
  <text x="540" y="448" fill="#0369A1" font-size="11">Information Expert (Lead owns historical logs)</text>
  <text x="910" y="448" fill="#15803D" font-size="11">Decoupled UI Presentation (Role Guard)</text>
</svg>
