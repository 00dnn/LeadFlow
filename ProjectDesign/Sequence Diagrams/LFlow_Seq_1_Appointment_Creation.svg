<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 630" width="1580" height="630" style="background:#FFFFFF; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="soft-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="16" width="1520" height="52" rx="8" fill="#1E293B" filter="url(#card-shadow)"/>
  <text x="50" y="48" fill="#FFFFFF" font-size="18" font-weight="700">LeadFlow — Sequence 1: Appointment Scheduling &amp; Closer Assignment</text>
  <text x="1270" y="47" fill="#94A3B8" font-size="12" font-weight="500">Scenario: Setter Workflow &amp; Lead Creation</text>

  <!-- Layer Group Boxes -->
  <rect x="50" y="80" width="120" height="480" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="60" y="100" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1">ACTOR (SETTER)</text>

  <rect x="180" y="80" width="370" height="480" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="195" y="100" fill="#0369A1" font-size="10" font-weight="700" letter-spacing="1">PRESENTATION (MVC)</text>

  <rect x="560" y="80" width="310" height="480" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="575" y="100" fill="#15803D" font-size="10" font-weight="700" letter-spacing="1">SERVICE LAYER</text>

  <rect x="880" y="80" width="180" height="480" rx="8" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5"/>
  <text x="895" y="100" fill="#7E22CE" font-size="10" font-weight="700" letter-spacing="1">DOMAIN MODEL</text>

  <rect x="1070" y="80" width="270" height="480" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="1085" y="100" fill="#B45309" font-size="10" font-weight="700" letter-spacing="1">PERSISTENCE</text>

  <rect x="1350" y="80" width="180" height="480" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1365" y="100" fill="#475569" font-size="10" font-weight="700" letter-spacing="1">OBSERVER BUS</text>

  <!-- Lifelines -->
  <line x1="110" y1="160" x2="110" y2="540" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="240" y1="160" x2="240" y2="540" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="360" y1="160" x2="360" y2="540" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="480" y1="160" x2="480" y2="540" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="620" y1="160" x2="620" y2="540" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="750" y1="160" x2="750" y2="540" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="970" y1="160" x2="970" y2="540" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="1135" y1="160" x2="1135" y2="540" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="1275" y1="160" x2="1275" y2="540" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="1440" y1="160" x2="1440" y2="540" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Participant Headers -->
  <rect x="60" y="115" width="100" height="42" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="110" y="133" fill="#1E40AF" font-size="11" font-weight="700" text-anchor="middle">Setter</text>
  <text x="110" y="147" fill="#64748B" font-size="9" text-anchor="middle">(Sarah Jenkins)</text>

  <rect x="190" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="240" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">Web UI</text>
  <text x="240" y="147" fill="#64748B" font-size="9" text-anchor="middle">(index.html)</text>

  <rect x="310" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="360" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">ModalController</text>
  <text x="360" y="147" fill="#64748B" font-size="9" text-anchor="middle">Controller</text>

  <rect x="430" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="480" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">DashboardCtrl</text>
  <text x="480" y="147" fill="#64748B" font-size="9" text-anchor="middle">Controller</text>

  <rect x="570" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="620" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">UserService</text>
  <text x="620" y="147" fill="#15803D" font-size="9" text-anchor="middle">Service Layer</text>

  <rect x="700" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="750" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">LeadService</text>
  <text x="750" y="147" fill="#15803D" font-size="9" text-anchor="middle">Business Logic</text>

  <rect x="910" y="115" width="120" height="42" rx="6" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="970" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">Lead &amp; History</text>
  <text x="970" y="147" fill="#7E22CE" font-size="9" text-anchor="middle">Domain Entities</text>

  <rect x="1080" y="115" width="110" height="42" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1135" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">ILeadRepository</text>
  <text x="1135" y="147" fill="#B45309" font-size="9" text-anchor="middle">LocalStorageImpl</text>

  <rect x="1225" y="115" width="100" height="42" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1275" y="133" fill="#78350F" font-size="11" font-weight="700" text-anchor="middle">localStorage</text>
  <text x="1275" y="147" fill="#B45309" font-size="9" text-anchor="middle">Browser Storage</text>

  <rect x="1390" y="115" width="100" height="42" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1440" y="133" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">EventEmitter</text>
  <text x="1440" y="147" fill="#475569" font-size="9" text-anchor="middle">Observer Bus</text>

  <!-- Sequence Messages -->
  <!-- 1.1 -->
  <line x1="110" y1="185" x2="238" y2="185" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="179" fill="#0F172A" font-size="11">1. Inputs appointment details &amp; clicks "Create Appointment"</text>

  <!-- 1.2 -->
  <line x1="240" y1="215" x2="358" y2="215" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="209" fill="#0F172A" font-size="11">2. _handleCreateSubmit(event)</text>

  <!-- 1.3 -->
  <line x1="360" y1="240" x2="618" y2="240" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="234" fill="#0F172A" font-size="11">3. getActiveUser()</text>

  <line x1="620" y1="260" x2="362" y2="260" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="370" y="255" fill="#64748B" font-size="10">returns activeSetter (role: "setter")</text>

  <!-- 1.4 -->
  <line x1="360" y1="290" x2="748" y2="290" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="370" y="284" fill="#0F172A" font-size="11" font-weight="600">4. createAppointment(data, setterUser)</text>

  <!-- Self-call validate -->
  <path d="M 750 305 L 790 305 L 790 325 L 752 325" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="800" y="318" fill="#15803D" font-size="10">validateAppointmentData(data) [name, phone, closerId]</text>

  <!-- 1.5 Entity creation -->
  <line x1="750" y1="350" x2="968" y2="350" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="760" y="344" fill="#6B21A8" font-size="11">5. new HistoryEntry(setter, PENDING) &amp; new Lead(...)</text>

  <!-- 1.6 Repo save -->
  <line x1="750" y1="380" x2="1133" y2="380" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="760" y="374" fill="#B45309" font-size="11">6. repository.save(lead)</text>

  <!-- 1.7 localStorage -->
  <line x1="1135" y1="405" x2="1273" y2="405" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="1145" y="399" fill="#B45309" font-size="10">setItem("leadflow_leads", serializedLeads)</text>

  <!-- 1.8 Emit event -->
  <line x1="750" y1="435" x2="1438" y2="435" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="429" fill="#1E293B" font-size="11">7. eventEmitter.emit("lead:created", newLead)</text>

  <!-- 1.9 Observer update -->
  <line x1="1440" y1="460" x2="482" y2="460" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="454" fill="#0369A1" font-size="11">8. Observer: on("lead:created") -&gt; renderStats(), renderTable()</text>

  <!-- 1.10 Refresh UI -->
  <line x1="480" y1="480" x2="242" y2="480" stroke="#0284C7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="250" y="474" fill="#0369A1" font-size="10">Increments "Total Submitted" KPI &amp; renders new lead row</text>

  <!-- Return lead to ModalCtrl -->
  <line x1="750" y1="502" x2="362" y2="502" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="370" y="497" fill="#64748B" font-size="10">returns newLead aggregate</text>

  <line x1="360" y1="524" x2="242" y2="524" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="250" y="519" fill="#64748B" font-size="10">closeCreateModal() &amp; Toast.success("Appointment scheduled")</text>

  <line x1="240" y1="546" x2="112" y2="546" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-return)"/>
  <text x="120" y="541" fill="#64748B" font-size="10">Displays green floating toast feedback</text>

  <!-- Legend -->
  <rect x="50" y="575" width="1480" height="38" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="598" fill="#475569" font-size="11" font-weight="600">Key Principles:</text>
  <text x="180" y="598" fill="#15803D" font-size="11">SRP (Validation &amp; Business Rules in LeadService)</text>
  <text x="540" y="598" fill="#B45309" font-size="11">DIP (ILeadRepository Interface Realization)</text>
  <text x="880" y="598" fill="#0284C7" font-size="11">Observer Pattern (Loose Coupling via EventEmitter)</text>
  <text x="1240" y="598" fill="#7E22CE" font-size="11">Information Expert (Lead Aggregate)</text>
</svg>
